<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
    
  <defs>
    <linearGradient id="bgPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="55%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <radialGradient id="bgCobalt" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#478BFF"/>
      <stop offset="50%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#05113D"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobaltGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="25%" stop-color="#478BFF"/>
      <stop offset="75%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <linearGradient id="skinWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D5538"/>
      <stop offset="55%" stop-color="#6E3D23"/>
      <stop offset="100%" stop-color="#4E2916"/>
    </linearGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05113D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E46F5" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

    <rect width="600" height="600" rx="64" fill="url(#bgPearl)"/>
    <circle cx="300" cy="300" r="210" fill="#FFFFFF" opacity="0.75"/>
    <ellipse cx="300" cy="495" rx="150" ry="26" fill="#0E46F5" opacity="0.14"/>
    <g filter="url(#drop3d)">
      <!-- 3D Crossed Saw & Hammer in Glossy Porcelain & Electric Blue -->
      <g transform="translate(300 300) rotate(-32) translate(-300 -300)">
        <rect x="272" y="150" width="56" height="310" rx="28" fill="url(#cobaltGloss)" stroke="#FFFFFF" stroke-width="4"/>
        <rect x="284" y="168" width="12" height="260" rx="6" fill="#FFFFFF" opacity="0.45"/>
        <path d="M175 130 H425 C445 130 460 146 460 166 V204 C460 220 446 232 430 232 H175 C158 232 145 218 145 202 V160 C145 144 158 130 175 130 Z" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="5"/>
        <rect x="165" y="144" width="260" height="16" rx="8" fill="#FFFFFF" opacity="0.9"/>
      </g>
      <g transform="translate(300 300) rotate(34) translate(-300 -300)">
        <path d="M250 110 L355 110 L375 390 L230 390 Z" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="5"/>
        <rect x="220" y="365" width="165" height="95" rx="28" fill="url(#cobaltGloss)" stroke="#FFFFFF" stroke-width="5"/>
        <circle cx="302" cy="412" r="22" fill="url(#bgPearl)"/>
      </g>
      <circle cx="445" cy="185" r="24" fill="url(#goldGloss)"/>
    </g>
  </svg>