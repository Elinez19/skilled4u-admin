<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
    
  <defs>
    <linearGradient id="bgPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="55%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <radialGradient id="bgCobalt" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#478BFF"/>
      <stop offset="50%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#05113D"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobaltGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="25%" stop-color="#478BFF"/>
      <stop offset="75%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <linearGradient id="skinWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D5538"/>
      <stop offset="55%" stop-color="#6E3D23"/>
      <stop offset="100%" stop-color="#4E2916"/>
    </linearGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05113D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E46F5" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

    <rect width="640" height="560" fill="url(#bgPearl)"/>
    <circle cx="320" cy="280" r="220" fill="#FFFFFF" opacity="0.85"/>
    <g filter="url(#drop3d)">
      <!-- 3D Styled Skilled Artisan in Cobalt Uniform & Glossy Helmet -->
      <path d="M145 560 C145 425 215 380 320 380 C425 380 495 425 495 560 Z" fill="url(#porcelain)"/>
      <!-- Cobalt Overalls -->
      <path d="M215 390 H425 L445 560 H195 Z" fill="url(#cobaltGloss)"/>
      <rect x="275" y="445" width="90" height="65" rx="16" fill="#FFFFFF" opacity="0.22"/>
      <!-- Neck & Face -->
      <rect x="292" y="315" width="56" height="80" rx="26" fill="url(#skinWarm)"/>
      <rect x="238" y="175" width="164" height="180" rx="80" fill="url(#skinWarm)"/>
      <!-- 3D Glossy Cobalt Hard Hat -->
      <path d="M222 205 C222 135 265 95 320 95 C375 95 418 135 418 205 Z" fill="url(#cobaltGloss)" stroke="#FFFFFF" stroke-width="5"/>
      <rect x="206" y="192" width="228" height="26" rx="13" fill="url(#porcelain)"/>
      <!-- Eyes & Smile -->
      <ellipse cx="286" cy="252" rx="19" ry="21" fill="#FFFFFF"/>
      <circle cx="290" cy="252" r="10" fill="#05113D"/>
      <circle cx="294" cy="247" r="4" fill="#FFFFFF"/>
      <ellipse cx="354" cy="252" rx="19" ry="21" fill="#FFFFFF"/>
      <circle cx="350" cy="252" r="10" fill="#05113D"/>
      <circle cx="354" cy="247" r="4" fill="#FFFFFF"/>
      <path d="M284 300 Q320 332 356 300 Z" fill="#FFFFFF"/>
      <!-- Glossy White & Blue Toolbox -->
      <rect x="390" y="385" width="180" height="120" rx="24" fill="url(#porcelain)" stroke="#0E46F5" stroke-width="5"/>
      <rect x="390" y="425" width="180" height="22" fill="url(#cobaltGloss)"/>
      <rect x="462" y="418" width="36" height="36" rx="10" fill="url(#goldGloss)"/>
    </g>
  </svg>